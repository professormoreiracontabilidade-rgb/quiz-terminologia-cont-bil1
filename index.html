<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contabilidade de Custos — Quiz 1</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf3fa;color:#14253d;font:19px/1.55 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:18px 16px 100px}h1{font-size:34px;line-height:1.15}h2{font-size:27px;line-height:1.3}.brand{color:#395b89;font-size:13px;font-weight:800;letter-spacing:1px}.cover{background:linear-gradient(145deg,#092b55,#165e98);color:white;border-radius:24px;padding:30px 24px;margin-top:22px}.cover .brand{color:#cfe6ff}.motto{font-size:24px;color:#ffe28a;font-weight:900}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:13px;padding:16px;background:#134f89;color:white;font-weight:700;min-height:54px}button:disabled{opacity:.5;cursor:default}input{width:100%;padding:14px;border:1px solid #aec0d7;border-radius:12px;margin:12px 0}.choice{display:block;width:100%;text-align:left;background:white;color:#172d49;border:2px solid #c6d4e4;margin:12px 0;font-weight:500}.choice.selected{border-color:#236ecd;background:#dfebff}.choice.good,.good{background:#087838!important;color:white!important;border-color:#087838!important}.choice.bad,.bad{background:#b52b33!important;color:white!important;border-color:#b52b33!important}.badge{font-weight:800;color:#1e5a91}.source{font-size:13px;color:#53647a}.text{white-space:pre-line;overflow-wrap:anywhere}.panel{background:white;border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 5px 24px #163e6510}.nav{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.nav button{flex:1}.small{font-size:14px}.status{padding:18px;border-radius:14px;font-size:24px;font-weight:900;margin:15px 0}progress{width:100%;accent-color:#168250}img{width:100%;height:auto}table{width:100%;border-collapse:collapse;font-size:16px;margin:18px 0}td{border:1px solid #bbc9d7;padding:8px}td:last-child{text-align:right}tr:first-child{background:#e7eff8;font-weight:700}a{color:#13598a}footer{font-size:12px;text-align:center;color:#5a6c83}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px}.toolbar button{font-size:14px;padding:8px;min-height:42px}@media(max-width:380px){body{font-size:18px}.cover{padding:24px 18px}h1{font-size:30px}}
</style><main id="app"></main><script>
const Q=[{"num": 1, "source": "FGV - Ana Leg (ALEGO)/ALEGO/Analista de Controle Externo/Contabilidade/2026", "text": "Uma entidade de pequeno porte oferecia serviços de consultoria e de auditoria. Por ter um número limitado de empregados, a entidade possuía um cliente para cada tipo de serviço. Em 2025, os seus custos foram os seguintes:\n\n• Aluguel do escritório: R$ 100.000 • Equipe de auditoria: R$ 240.000 • Equipe de consultoria: R$ 280.000 • Empregados administrativos e de suporte: R$ 300.000.\n\nNo ano, os custos que demandavam rateio apresentavam o seguinte total:", "options": [{"letter": "A", "text": "R$ 100.000."}, {"letter": "B", "text": "R$ 300.000."}, {"letter": "C", "text": "R$ 400.000."}, {"letter": "D", "text": "R$ 520.000."}, {"letter": "E", "text": "R$ 820.000."}], "answer": "C", "resolution": "Aluguel do escritório e empregados administrativos e de suporte são comuns aos dois serviços e exigem rateio: R$ 100.000 + R$ 300.000 = R$ 400.000. As equipes de auditoria e consultoria são diretamente identificáveis."}, {"num": 2, "source": "FGV - ACE (TCE RR)/TCE RR/Ciências Contábeis/2025", "text": "Em relação à Contabilidade de Custos, considere os tipos de entidades a seguir.\n\nI. Industriais\n\nII. Comerciais\n\nIII. Financeiras\n\nIV. Prestadoras de serviços\n\nO uso dos conceitos da Contabilidade de Custos é útil para a(s) entidade(s)", "options": [{"letter": "A", "text": "I, apenas."}, {"letter": "B", "text": "I, II e III, apenas."}, {"letter": "C", "text": "I, II e IV, apenas."}, {"letter": "D", "text": "II, III e IV, apenas."}, {"letter": "E", "text": "I, II, III e IV."}], "answer": "E", "resolution": "A contabilidade de custos é útil para indústrias, comércio, instituições financeiras e prestadores de serviços. Todos consomem recursos e precisam apurar e controlar seus custos."}, {"num": 3, "source": "FGV - AF (SEFAZ PR)/SEFAZ PR/2025", "text": "Em relação à utilidade da Contabilidade de Custos, analise as afirmativas a seguir.\n\nI. Auxilia na definição de preço de um serviço. II. Permite escolher entre o método de custeio variável e o método de custeio por absorção. III. Permite escolher o produto a ser produzido, quando há escassez de matéria prima.\n\nGerencialmente, a Contabilidade de Custos auxilia os gestores a tomar a(s) decisão(ões) apresentadas em", "options": [{"letter": "A", "text": "I, apenas."}, {"letter": "B", "text": "I e II, apenas."}, {"letter": "C", "text": "I e III, apenas."}, {"letter": "D", "text": "II e III, apenas."}, {"letter": "E", "text": "I, II e III."}], "answer": "C", "resolution": "As afirmativas I e III indicam decisões gerenciais: definir preços e escolher a produção diante de escassez de matéria-prima. A II trata da escolha de um método de custeio, não da decisão operacional considerada pelo gabarito."}, {"num": 4, "source": "FGV - AFFC (STN)/STN/Contábil/2024", "text": "Assinale a opção que indica uma utilidade da contabilidade de custos para a contabilidade financeira e uma para a contabilidade gerencial, respectivamente.", "options": [{"letter": "A", "text": "Mensuração dos estoques para o balanço patrimonial e determinação das perdas estimadas com crédito de liquidação duvidosa."}, {"letter": "B", "text": "Mensuração dos estoques para o balanço patrimonial e apuração da vida útil dos ativos imobilizados para efeito de depreciação."}, {"letter": "C", "text": "Base para reconhecimento de dividendos distribuídos a sócios e para determinação do preço que deve ser cobrado para cobrir o custo do produto."}, {"letter": "D", "text": "Mensuração do custo dos produtos vendidos para apuração do resultado e base para determinação do preço que deve ser cobrado para cobrir o custo do produto."}, {"letter": "E", "text": "Mensuração do custo dos produtos vendidos para apuração do resultado e determinação das perdas estimadas com crédito de liquidação duvidosa."}], "answer": "D", "resolution": "Na contabilidade financeira, o custo dos produtos vendidos participa da apuração do resultado. Na gerencial, os custos dão suporte à formação do preço de venda."}, {"num": 5, "source": "FGV - Aud CE (TCE-PA)/TCE PA/Administrativa/Contabilidade/2024", "text": "Leia o fragmento a seguir em relação à evolução da contabilidade de custos.\n\nEm um primeiro momento, a contabilidade de custos visava à mensuração monetária . Posteriormente, a contabilidade de custos passou a ter duas funções relevantes, o auxílio ao e a ajuda à .\n\nAssinale a opção que completa corretamente as lacunas do fragmento acima.", "options": [{"letter": "A", "text": "dos ativos e dos passivos- controle- evidenciação."}, {"letter": "B", "text": "dos estoques e do resultado – controle- tomada de decisões."}, {"letter": "C", "text": "dos estoques e do resultado – monitoramento – mensuração do resultado."}, {"letter": "D", "text": "das receitas e das despesas – controle – mensuração do resultado."}, {"letter": "E", "text": "dos ativos e dos passivos – monitoramento – tomada de decisões."}], "answer": "B", "resolution": "A finalidade inicial era mensurar estoques e resultado. Com a evolução, a contabilidade de custos também passou a auxiliar o controle e a tomada de decisões."}, {"num": 6, "source": "FGV - ContLeg (CM Taubaté)/CM Taubaté/2022", "text": "A Contabilidade pode ser segmentada em Contabilidade Financeira e Contabilidade Gerencial. Um objetivo da Contabilidade Gerencial é", "options": [{"letter": "A", "text": "fornecer informações aos investidores."}, {"letter": "B", "text": "auxiliar a tomada de decisão dos gestores."}, {"letter": "C", "text": "elaborar a declaração do imposto de renda."}, {"letter": "D", "text": "evidenciar a saúde financeira da entidade ao público em geral."}, {"letter": "E", "text": "constituir a base de informação para elaboração das demonstrações contábeis pelos contadores."}], "answer": "B", "resolution": "A contabilidade gerencial produz informações para os gestores tomarem decisões, planejarem e controlarem a entidade."}, {"num": 7, "source": "FGV - Tec (FunSaúde CE)/FunSaúde CE/Contabilidade/2021", "text": "O campo de atuação da Contabilidade é muito amplo e abrange diferentes segmentos.\n\nCom relação às finalidades de cada segmento, assinale a afirmativa correta.", "options": [{"letter": "A", "text": "A Contabilidade de Custos é utilizada exclusivamente pela Contabilidade Gerencial."}, {"letter": "B", "text": "A Contabilidade Gerencial abrange as informações a serem fornecidas aos tomadores de decisão, isto é, às pessoas internas à organização."}, {"letter": "C", "text": "A Contabilidade Fiscal tem como objetivo orientar investidores e credores na decisão de onde alocar seus recursos."}, {"letter": "D", "text": "A Contabilidade Financeira é utilizada internamente para decisões sobre a produção de novos produtos."}, {"letter": "E", "text": "A Contabilidade Pública objetiva fornecer informação ao Governo, principalmente à Secretaria da Receita Federal do Brasil."}], "answer": "B", "resolution": "A contabilidade gerencial atende às pessoas internas à organização. A contabilidade de custos também atende à financeira; a fiscal trata das obrigações tributárias."}, {"num": 8, "source": "FGV - ATRE (SEFIN RO)/SEFIN RO/2018", "text": "A contabilidade apresenta subdivisões para fornecer diferentes tipos de informações.\n\nEntre as funções da contabilidade de custos está a de", "options": [{"letter": "A", "text": "oferecer ao gestor a capacidade de gerar informações que permitam o planejamento das ações no ambiente operacional."}, {"letter": "B", "text": "transmitir aos fornecedores segurança em relação ao cumprimento das obrigações da entidade."}, {"letter": "C", "text": "orientar investidores e credores ao decidirem onde alocar seus recursos."}, {"letter": "D", "text": "avaliar o desempenho dos setores administrativos da empresa e de seus empregados."}, {"letter": "E", "text": "garantir aos emprestadores de recursos que os prazos serão cumpridos."}], "answer": "A", "resolution": "Informações de custos permitem planejar ações operacionais, avaliar consumo de recursos e apoiar decisões de produção."}, {"num": 9, "source": "FGV - Ass Leg (ALERO)/ALERO/Técnico em Contabilidade/2018", "text": "Em relação ao campo de aplicação da contabilidade, assinale a afirmativa correta.", "options": [{"letter": "A", "text": "A contabilidade financeira tem como função gerar informações que permitam o planejamento das ações no ambiente operacional."}, {"letter": "B", "text": "A contabilidade financeira inclui fatores como considerações políticas e ambientais."}, {"letter": "C", "text": "A contabilidade gerencial abrange as informações a serem fornecidas aos gestores da entidade."}, {"letter": "D", "text": "A contabilidade tributária fornece informações que relatam a essência econômica das transações."}, {"letter": "E", "text": "A contabilidade tributária busca orientar investidores e credores ao decidirem onde alocar seus recursos."}], "answer": "C", "resolution": "A contabilidade gerencial fornece informações aos gestores. As informações para investidores e credores são características da contabilidade financeira."}, {"num": 10, "source": "FGV - ADTND (AMAZUL)/AMAZUL/Contador/2026", "text": "Em dezembro de 2025, uma sociedade empresária decidiu começar a fabricar um novo produto a partir de 2026. Com este objetivo, adquiriu, em dezembro, uma máquina, por R$50.000 e matéria prima, por R$10.000. Além disso, pagou, antecipadamente, R$20.000, por um treinamento que será oferecido a seus empregados.\n\nDe acordo com a terminologia de custos, em dezembro, classifica-se como Investimentos o seguinte montante:", "options": [{"letter": "A", "text": "R$10.000."}, {"letter": "B", "text": "R$50.000."}, {"letter": "C", "text": "R$60.000."}, {"letter": "D", "text": "R$70.000."}, {"letter": "E", "text": "R$80.000."}], "answer": "C", "resolution": "O gabarito do PDF é C: máquina (R$ 50.000) + matéria-prima (R$ 10.000) = R$ 60.000. Atenção: o treinamento ainda não prestado e pago antecipadamente, de R$ 20.000, apresenta benefício futuro e pode ser reconhecido como pagamento antecipado. Pela definição ampla de investimento como gasto ativado, haveria argumento para R$ 80.000 (E). O quiz conserva C, conforme o PDF, e registra essa divergência para revisão."}],quiz=1,key='moreira-custos-pdf-v1-'+quiz;let state={page:'cover',i:0,answers:{},name:'',sound:true};try{const saved=JSON.parse(localStorage.getItem(key));if(saved)state={...state,...saved}}catch(e){}let selected=null,ctx;const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}function sound(ok){if(!state.sound)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();const notes=ok?[523,659,784,1047]:[220,165];notes.forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=ok?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(0,ctx.currentTime+i*.18);g.gain.linearRampToValueAtTime(.65,ctx.currentTime+i*.18+.015);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+i*.18+.35);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+i*.18);o.stop(ctx.currentTime+i*.18+.36)})}catch(e){}}function go(p,i=state.i){state.page=p;state.i=i;selected=null;save();render();window.scrollTo(0,0)}function score(){return Q.filter(q=>state.answers[q.num]===q.answer).length}function toolbar(){return `<div class="toolbar"><span class="brand">PROFESSOR MOREIRA • QUIZ ${quiz}</span><button id="mute">${state.sound?'🔊 Som ligado':'🔇 Som desligado'}</button></div>`}function render(){let q=Q[state.i];if(state.page==='cover'){app.innerHTML=`<div class="cover"><div class="brand">CURSO DE CONTABILIDADE PROFESSOR MOREIRA</div><h1>CONTABILIDADE<br>DE CUSTOS</h1><p class="motto">TREINAMENTO DIFÍCIL,<br>COMBATE FÁCIL</p><p>Quiz ${quiz} • ${Q.length} questões<br>Questões ${Q[0].num} a ${Q.at(-1).num}</p></div><div class="panel"><label for="name">Nome do aluno</label><input id="name" placeholder="Digite seu nome" value="${esc(state.name)}"><p class="small">Uma questão por tela. Confirme a alternativa e abra a resolução na próxima tela. Acerto verde e erro vermelho, com som.</p><p class="small">Para ouvir o som alto, aumente o volume de mídia do celular.</p><button id="start">Começar / continuar →</button><p id="error" role="alert"></p></div>`;document.getElementById('start').onclick=()=>{state.name=document.getElementById('name').value.trim();if(!state.name){document.getElementById('error').textContent='Informe seu nome para começar.';return}sound(true);go('question')};return}
app.innerHTML=toolbar()+`<p class="small">${esc(state.name)} • ${score()} acertos</p>`;document.getElementById('mute').onclick=()=>{state.sound=!state.sound;save();render()};if(state.page==='end'){app.innerHTML+=`<div class="panel"><h1>Treinamento concluído!</h1><h2>${score()} / ${Q.length} acertos</h2><p>Aproveitamento: ${Math.round(score()/Q.length*100)}%</p><p>Quem quer ser aprovado <strong>estuda</strong>.</p><button id="send">Enviar resultado ao Professor pelo WhatsApp</button><div class="nav"><button id="review">Revisar</button><button id="restart">Reiniciar</button></div></div>`;document.getElementById('send').onclick=()=>window.open('https://wa.me/5561985323574?text='+encodeURIComponent(`Professor Moreira, sou ${state.name}. Concluí o Quiz ${quiz} de Contabilidade de Custos (questões ${Q[0].num} a ${Q.at(-1).num}). Resultado: ${score()} de ${Q.length} acertos (${Math.round(score()/Q.length*100)}%).`),'_blank');document.getElementById('review').onclick=()=>go('question',0);document.getElementById('restart').onclick=restart;return}
app.innerHTML+=`<progress max="${Q.length}" value="${Object.keys(state.answers).length}"></progress><p class="badge">${state.page==='resolution'?'Resolução':'Questão'} ${q.num} • ${state.i+1} de ${Q.length}</p>`;
if(state.page==='question'){const answered=state.answers[q.num];let text=q.text,after='';if(q.image){const parts=text.split('O total dos gastos de produção é:');text=parts[0];after='O total dos gastos de produção é:'}app.innerHTML+=`<p class="source">${esc(q.source)}</p><div class="panel text">${esc(text)}${q.table?'<table>'+q.table.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</table><div class="text">'+esc(q.after)+'</div>':''}${q.image?'<p><a href="'+q.image+'" target="_blank" aria-label="Ampliar tabela"><img src="'+q.image+'" alt="Tabela de gastos de produção e despesas da Indústria Lubelle"></a></p><div>'+esc(after)+'</div>':''}</div><div id="options">${q.options.map(o=>`<button class="choice ${answered?(o.letter===q.answer?'good':o.letter===answered?'bad':''):''}" data-option="${o.letter}" ${answered?'disabled':''}>${o.letter}) ${esc(o.text)}</button>`).join('')}</div><div id="feedback" role="status">${answered?`<div class="status ${answered===q.answer?'good':'bad'}">${answered===q.answer?'✅ ACERTOU!':'❌ ERROU!'}</div>`:''}</div><button id="confirm" ${answered?'hidden':'disabled'}>Confirmar resposta</button><button id="resolution" ${answered?'':'hidden'}>Ver resolução →</button><div class="nav"><button id="prev" ${state.i?'':'disabled'}>← Anterior</button><button id="cover">Capa</button></div>`;document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{selected=b.dataset.option;document.querySelectorAll('[data-option]').forEach(x=>x.classList.toggle('selected',x===b));document.getElementById('confirm').disabled=false});document.getElementById('confirm').onclick=()=>{if(!selected)return;state.answers[q.num]=selected;save();sound(selected===q.answer);render();document.getElementById('feedback').scrollIntoView({behavior:'smooth',block:'center'})};document.getElementById('resolution').onclick=()=>go('resolution');document.getElementById('prev').onclick=()=>go('question',state.i-1);document.getElementById('cover').onclick=()=>go('cover')
}else{app.innerHTML+=`<div class="panel"><h2>Gabarito do PDF: ${q.answer}</h2><p>${esc(q.options.find(o=>o.letter===q.answer).text)}</p><hr><p class="text">${esc(q.resolution)}</p></div><div class="nav"><button id="back">← Questão</button><button id="next">${state.i===Q.length-1?'Ver resultado':'Próxima questão →'}</button></div>`;document.getElementById('back').onclick=()=>go('question');document.getElementById('next').onclick=()=>go(state.i===Q.length-1?'end':'question',state.i===Q.length-1?state.i:state.i+1)}app.innerHTML+='<footer>CURSO DE CONTABILIDADE PROFESSOR MOREIRA</footer>'}
function restart(){if(confirm('Reiniciar este quiz e apagar as respostas?')){state.answers={};go('question',0)}}render();
</script></html>
