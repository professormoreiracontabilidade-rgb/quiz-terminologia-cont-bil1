const questions=[{"num": 1, "source": "FGV - Ana Leg (ALEGO)/ALEGO/Analista de Controle Externo/Contabilidade/2026", "text": "Uma entidade de pequeno porte oferecia serviços de consultoria e de auditoria. Por ter um número limitado de empregados, a entidade possuía um cliente para cada tipo de serviço. Em 2025, os seus custos foram os seguintes:\n\n• Aluguel do escritório: R$ 100.000 • Equipe de auditoria: R$ 240.000 • Equipe de consultoria: R$ 280.000 • Empregados administrativos e de suporte: R$ 300.000.\n\nNo ano, os custos que demandavam rateio apresentavam o seguinte total:", "options": [{"letter": "A", "text": "R$ 100.000."}, {"letter": "B", "text": "R$ 300.000."}, {"letter": "C", "text": "R$ 400.000."}, {"letter": "D", "text": "R$ 520.000."}, {"letter": "E", "text": "R$ 820.000."}], "answer": "C", "resolution": "Aluguel do escritório e empregados administrativos e de suporte são comuns aos dois serviços e exigem rateio: R$ 100.000 + R$ 300.000 = R$ 400.000. As equipes de auditoria e consultoria são diretamente identificáveis."}, {"num": 2, "source": "FGV - ACE (TCE RR)/TCE RR/Ciências Contábeis/2025", "text": "Em relação à Contabilidade de Custos, considere os tipos de entidades a seguir.\n\nI. Industriais\n\nII. Comerciais\n\nIII. Financeiras\n\nIV. Prestadoras de serviços\n\nO uso dos conceitos da Contabilidade de Custos é útil para a(s) entidade(s)", "options": [{"letter": "A", "text": "I, apenas."}, {"letter": "B", "text": "I, II e III, apenas."}, {"letter": "C", "text": "I, II e IV, apenas."}, {"letter": "D", "text": "II, III e IV, apenas."}, {"letter": "E", "text": "I, II, III e IV."}], "answer": "E", "resolution": "A contabilidade de custos é útil para indústrias, comércio, instituições financeiras e prestadores de serviços. Todos consomem recursos e precisam apurar e controlar seus custos."}, {"num": 3, "source": "FGV - AF (SEFAZ PR)/SEFAZ PR/2025", "text": "Em relação à utilidade da Contabilidade de Custos, analise as afirmativas a seguir.\n\nI. Auxilia na definição de preço de um serviço. II. Permite escolher entre o método de custeio variável e o método de custeio por absorção. III. Permite escolher o produto a ser produzido, quando há escassez de matéria prima.\n\nGerencialmente, a Contabilidade de Custos auxilia os gestores a tomar a(s) decisão(ões) apresentadas em", "options": [{"letter": "A", "text": "I, apenas."}, {"letter": "B", "text": "I e II, apenas."}, {"letter": "C", "text": "I e III, apenas."}, {"letter": "D", "text": "II e III, apenas."}, {"letter": "E", "text": "I, II e III."}], "answer": "C", "resolution": "As afirmativas I e III indicam decisões gerenciais: definir preços e escolher a produção diante de escassez de matéria-prima. A II trata da escolha de um método de custeio, não da decisão operacional considerada pelo gabarito."}, {"num": 4, "source": "FGV - AFFC (STN)/STN/Contábil/2024", "text": "Assinale a opção que indica uma utilidade da contabilidade de custos para a contabilidade financeira e uma para a contabilidade gerencial, respectivamente.", "options": [{"letter": "A", "text": "Mensuração dos estoques para o balanço patrimonial e determinação das perdas estimadas com crédito de liquidação duvidosa."}, {"letter": "B", "text": "Mensuração dos estoques para o balanço patrimonial e apuração da vida útil dos ativos imobilizados para efeito de depreciação."}, {"letter": "C", "text": "Base para reconhecimento de dividendos distribuídos a sócios e para determinação do preço que deve ser cobrado para cobrir o custo do produto."}, {"letter": "D", "text": "Mensuração do custo dos produtos vendidos para apuração do resultado e base para determinação do preço que deve ser cobrado para cobrir o custo do produto."}, {"letter": "E", "text": "Mensuração do custo dos produtos vendidos para apuração do resultado e determinação das perdas estimadas com crédito de liquidação duvidosa."}], "answer": "D", "resolution": "Na contabilidade financeira, o custo dos produtos vendidos participa da apuração do resultado. Na gerencial, os custos dão suporte à formação do preço de venda."}, {"num": 5, "source": "FGV - Aud CE (TCE-PA)/TCE PA/Administrativa/Contabilidade/2024", "text": "Leia o fragmento a seguir em relação à evolução da contabilidade de custos.\n\nEm um primeiro momento, a contabilidade de custos visava à mensuração monetária . Posteriormente, a contabilidade de custos passou a ter duas funções relevantes, o auxílio ao e a ajuda à .\n\nAssinale a opção que completa corretamente as lacunas do fragmento acima.", "options": [{"letter": "A", "text": "dos ativos e dos passivos- controle- evidenciação."}, {"letter": "B", "text": "dos estoques e do resultado – controle- tomada de decisões."}, {"letter": "C", "text": "dos estoques e do resultado – monitoramento – mensuração do resultado."}, {"letter": "D", "text": "das receitas e das despesas – controle – mensuração do resultado."}, {"letter": "E", "text": "dos ativos e dos passivos – monitoramento – tomada de decisões."}], "answer": "B", "resolution": "A finalidade inicial era mensurar estoques e resultado. Com a evolução, a contabilidade de custos também passou a auxiliar o controle e a tomada de decisões."}, {"num": 6, "source": "FGV - ContLeg (CM Taubaté)/CM Taubaté/2022", "text": "A Contabilidade pode ser segmentada em Contabilidade Financeira e Contabilidade Gerencial. Um objetivo da Contabilidade Gerencial é", "options": [{"letter": "A", "text": "fornecer informações aos investidores."}, {"letter": "B", "text": "auxiliar a tomada de decisão dos gestores."}, {"letter": "C", "text": "elaborar a declaração do imposto de renda."}, {"letter": "D", "text": "evidenciar a saúde financeira da entidade ao público em geral."}, {"letter": "E", "text": "constituir a base de informação para elaboração das demonstrações contábeis pelos contadores."}], "answer": "B", "resolution": "A contabilidade gerencial produz informações para os gestores tomarem decisões, planejarem e controlarem a entidade."}, {"num": 7, "source": "FGV - Tec (FunSaúde CE)/FunSaúde CE/Contabilidade/2021", "text": "O campo de atuação da Contabilidade é muito amplo e abrange diferentes segmentos.\n\nCom relação às finalidades de cada segmento, assinale a afirmativa correta.", "options": [{"letter": "A", "text": "A Contabilidade de Custos é utilizada exclusivamente pela Contabilidade Gerencial."}, {"letter": "B", "text": "A Contabilidade Gerencial abrange as informações a serem fornecidas aos tomadores de decisão, isto é, às pessoas internas à organização."}, {"letter": "C", "text": "A Contabilidade Fiscal tem como objetivo orientar investidores e credores na decisão de onde alocar seus recursos."}, {"letter": "D", "text": "A Contabilidade Financeira é utilizada internamente para decisões sobre a produção de novos produtos."}, {"letter": "E", "text": "A Contabilidade Pública objetiva fornecer informação ao Governo, principalmente à Secretaria da Receita Federal do Brasil."}], "answer": "B", "resolution": "A contabilidade gerencial atende às pessoas internas à organização. A contabilidade de custos também atende à financeira; a fiscal trata das obrigações tributárias."}, {"num": 8, "source": "FGV - ATRE (SEFIN RO)/SEFIN RO/2018", "text": "A contabilidade apresenta subdivisões para fornecer diferentes tipos de informações.\n\nEntre as funções da contabilidade de custos está a de", "options": [{"letter": "A", "text": "oferecer ao gestor a capacidade de gerar informações que permitam o planejamento das ações no ambiente operacional."}, {"letter": "B", "text": "transmitir aos fornecedores segurança em relação ao cumprimento das obrigações da entidade."}, {"letter": "C", "text": "orientar investidores e credores ao decidirem onde alocar seus recursos."}, {"letter": "D", "text": "avaliar o desempenho dos setores administrativos da empresa e de seus empregados."}, {"letter": "E", "text": "garantir aos emprestadores de recursos que os prazos serão cumpridos."}], "answer": "A", "resolution": "Informações de custos permitem planejar ações operacionais, avaliar consumo de recursos e apoiar decisões de produção."}, {"num": 9, "source": "FGV - Ass Leg (ALERO)/ALERO/Técnico em Contabilidade/2018", "text": "Em relação ao campo de aplicação da contabilidade, assinale a afirmativa correta.", "options": [{"letter": "A", "text": "A contabilidade financeira tem como função gerar informações que permitam o planejamento das ações no ambiente operacional."}, {"letter": "B", "text": "A contabilidade financeira inclui fatores como considerações políticas e ambientais."}, {"letter": "C", "text": "A contabilidade gerencial abrange as informações a serem fornecidas aos gestores da entidade."}, {"letter": "D", "text": "A contabilidade tributária fornece informações que relatam a essência econômica das transações."}, {"letter": "E", "text": "A contabilidade tributária busca orientar investidores e credores ao decidirem onde alocar seus recursos."}], "answer": "C", "resolution": "A contabilidade gerencial fornece informações aos gestores. As informações para investidores e credores são características da contabilidade financeira."}, {"num": 10, "source": "FGV - ADTND (AMAZUL)/AMAZUL/Contador/2026", "text": "Em dezembro de 2025, uma sociedade empresária decidiu começar a fabricar um novo produto a partir de 2026. Com este objetivo, adquiriu, em dezembro, uma máquina, por R$50.000 e matéria prima, por R$10.000. Além disso, pagou, antecipadamente, R$20.000, por um treinamento que será oferecido a seus empregados.\n\nDe acordo com a terminologia de custos, em dezembro, classifica-se como Investimentos o seguinte montante:", "options": [{"letter": "A", "text": "R$10.000."}, {"letter": "B", "text": "R$50.000."}, {"letter": "C", "text": "R$60.000."}, {"letter": "D", "text": "R$70.000."}, {"letter": "E", "text": "R$80.000."}], "answer": "C", "resolution": "O gabarito do PDF é C: máquina (R$ 50.000) + matéria-prima (R$ 10.000) = R$ 60.000. Atenção: o treinamento ainda não prestado e pago antecipadamente, de R$ 20.000, apresenta benefício futuro e pode ser reconhecido como pagamento antecipado. Pela definição ampla de investimento como gasto ativado, haveria argumento para R$ 80.000 (E). O quiz conserva C, conforme o PDF, e registra essa divergência para revisão."}, {"num": 11, "source": "FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2026", "text": "A seguir, encontram-se alguns dos eventos da Indústria J em um determinado período:\n\nConsumo da matéria-prima X: R$ 17.900,00; Depreciação do prédio do escritório: R$ 6.600,00; Compra da matéria-prima X: R$ 100.000,00; Depreciação das máquinas do parque fabril: R$ 8.500,00; Remuneração dos funcionários do Faturamento (salários): R$ 23.000,00; Aquisição da máquina XFG210 para o parque fabril: R$ 149.000,00.\n\nAssinale a opção que apresenta os valores corretos de Custos, Despesas e Investimentos, de acordo com a terminologia contábil.", "options": [{"letter": "A", "text": "Custos: R$ 126.400,00; Despesas: R$ 29.600,00; Investimentos: R$ 149.000,00."}, {"letter": "B", "text": "Custos: R$ 26.400,00; Despesas: R$ 29.600,00; Investimentos: R$ 249.000,00."}, {"letter": "C", "text": "Custos: R$ 26.400,00; Despesas: R$ 52.600,00; Investimentos: R$ 149.000,00."}, {"letter": "D", "text": "Custos: R$ 35.100,00; Despesas: R$ 29.600,00; Investimentos: R$ 228.000,00."}], "answer": "B", "resolution": "Custos: matéria-prima consumida 17.900 + depreciação fabril 8.500 = R$ 26.400. Despesas: depreciação do escritório 6.600 + salários do faturamento 23.000 = R$ 29.600. Investimentos: compra de matéria-prima 100.000 + máquina 149.000 = R$ 249.000."}, {"num": 12, "source": "FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2025", "text": "Gasto pode ser definido como o sacrifício financeiro necessário para obter um produto ou serviço, representado pela entrega ou promessa de entrega de ativos. Assim, custos, despesas, investimentos e desembolsos são tipos de gastos.\n\nEm relação ao tema, analise as afirmativas a seguir.\n\nI. Custo é um gasto diretamente relacionado a um bem ou serviço utilizado na produção de outros bens e serviços.\n\nII. Despesa é um gasto com bens ou serviços consumidos direta ou indiretamente para obtenção de receitas.\n\nIII. Investimento é um gasto que se tornou um item do patrimônio líquido em função da expectativa de geração futura de caixa para a entidade ou em função de sua vida útil.\n\nIV. Desembolso é um gasto que ocorre quando bens ou serviços são consumidos de forma anormal e/ou involuntária que afetam diretamente o resultado da entidade.\n\nEstão corretas as afirmativas", "options": [{"letter": "A", "text": "III e IV, apenas."}, {"letter": "B", "text": "I, II e III, apenas."}, {"letter": "C", "text": "I e II, apenas."}, {"letter": "D", "text": "II, III e IV, apenas."}], "answer": "C", "resolution": "I e II estão corretas. Investimento é gasto ativado, e não item do patrimônio líquido. Desembolso é pagamento; consumo anormal ou involuntário caracteriza perda."}],quiz=1,storageKey='professor-moreira-custos-novo-v3-'+quiz;
let saved={name:'',answers:{},index:0,sound:true};try{const v=JSON.parse(localStorage.getItem(storageKey));if(v&&typeof v==='object'){saved.name=typeof v.name==='string'?v.name:'';saved.answers=v.answers&&typeof v.answers==='object'?v.answers:{};saved.index=Number.isInteger(v.index)?Math.min(Math.max(v.index,0),questions.length-1):0;saved.sound=v.sound!==false}}catch(e){}
let screen='cover',selection='';const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){try{localStorage.setItem(storageKey,JSON.stringify(saved))}catch(e){}}function stopAudio(){for(const id of ['correctAudio','wrongAudio']){const a=document.getElementById(id);a.pause();a.currentTime=0}}function playSound(ok){stopAudio();if(!saved.sound)return;const a=document.getElementById(ok?'correctAudio':'wrongAudio');a.volume=1;const p=a.play();if(p&&p.catch)p.catch(()=>{const n=document.getElementById('audioMessage');if(n)n.textContent='Toque em Ouvir som para reproduzir o áudio.'})}function navigate(next,index=saved.index){screen=next;saved.index=index;selection='';persist();render();window.scrollTo(0,0)}function result(){return questions.filter(q=>saved.answers[q.num]===q.answer).length}function whatsapp(message){window.open('https://wa.me/5561985323574?text='+encodeURIComponent(message),'_blank','noopener')}function header(){return `<div class="top"><span class="brand">PROFESSOR MOREIRA • QUIZ ${quiz}</span><button data-action="sound">${saved.sound?'🔊 Som ligado':'🔇 Som desligado'}</button></div>`}function bodyQuestion(q){let t=q.text,tail='';if(q.image){const marker=q.num===33?'O total dos gastos de produção é:':'O montante das despesas representa:';const parts=t.split(marker);t=parts[0];tail=marker}return `<p class="source">${esc(q.source)}</p><section class="panel"><div class="text">${esc(t)}</div>${q.table?'<div class="table-scroll"><table>'+q.table.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</table></div>':''}${q.after?'<div class="text">'+esc(q.after)+'</div>':''}${q.image?'<p class="image-note">Tabela original do PDF — amplie com o gesto de pinça do celular.</p><img src="'+q.image+'" alt="Gastos de produção e despesas da Indústria Lubelle"><p>'+esc(tail)+'</p>':''}</section>`}
function render(){if(screen==='cover'){app.innerHTML=`<section class="cover"><div class="brand">CURSO DE CONTABILIDADE PROFESSOR MOREIRA</div><h1>CONTABILIDADE<br>DE CUSTOS</h1><p class="slogan">TREINAMENTO DIFÍCIL,<br>COMBATE FÁCIL</p><p>Quiz ${quiz} • 12 questões</p><p class="small">Questões do PDF: ${questions.map(q=>q.num).join(', ')}</p></section><section class="panel"><button class="action whatsapp" data-action="access">📲 Solicitar acesso pelo WhatsApp</button><p class="small">Professor Moreira: (61) 9 8532-3574</p><label for="studentName"><strong>Nome do aluno</strong></label><input type="text" id="studentName" autocomplete="name" placeholder="Digite seu nome" value="${esc(saved.name)}"><p id="nameError" class="error" role="alert"></p><div class="nav"><button data-action="start">Iniciar novo quiz →</button>${Object.keys(saved.answers).length?'<button class="secondary" data-action="resume">Continuar</button>':''}</div><p class="small">Marque uma alternativa e toque em Confirmar resposta. Depois, abra a resolução em outra tela. Aumente o volume de mídia para ouvir os sons.</p></section>`;return}
app.innerHTML=header()+`<p class="small">${esc(saved.name)} • ${result()} acertos</p>`;
if(screen==='end'){app.innerHTML+=`<section class="panel"><h1>Treinamento concluído!</h1><h2>${result()} de 12 acertos</h2><p>Aproveitamento: ${Math.round(result()/12*100)}%</p><p>Quem quer ser aprovado <strong>estuda</strong>.</p><button class="whatsapp" data-action="send">Enviar resultado ao Professor pelo WhatsApp</button><div class="nav"><button data-action="review">Revisar questões</button><button class="secondary" data-action="reset">Reiniciar</button></div></section>`;return}
const q=questions[saved.index],answer=saved.answers[q.num];app.innerHTML+=`<progress value="${questions.filter(q=>saved.answers[q.num]).length}" max="12"></progress><p class="number">${screen==='question'?'Questão':'Resolução'} ${saved.index+1} de 12</p><p class="small">Questão ${q.num} do PDF</p>`;
if(screen==='question'){app.innerHTML+=bodyQuestion(q)+`<form id="answerForm"><fieldset style="border:0;padding:0;margin:0"><legend><strong>Marque sua resposta:</strong></legend>${q.options.map(o=>`<label class="option ${answer?(o.letter===q.answer?'correct':o.letter===answer?'incorrect':''):''}"><input type="radio" name="alternative" value="${o.letter}" ${answer===o.letter?'checked':''} ${answer?'disabled':''}><span><strong>${o.letter})</strong> ${esc(o.text)}</span></label>`).join('')}</fieldset><p id="choiceError" class="error" role="alert"></p>${answer?'':'<button id="confirm" type="submit">Confirmar resposta</button>'}</form>${answer?`<div class="signal ${answer===q.answer?'green':'red'}" role="status"><span class="lamp" aria-hidden="true"></span>${answer===q.answer?'ACERTOU!':'ERROU!'}</div><p id="audioMessage" class="small"></p><div class="nav"><button class="secondary" data-action="replay">🔊 Ouvir som</button><button class="secondary" data-action="retry">Responder novamente</button></div><button id="solution" data-action="solution">Ver resolução →</button>`:''}<div class="nav"><button class="secondary" data-action="previous" ${saved.index===0?'disabled':''}>← Anterior</button><button class="secondary" data-action="cover">Capa</button><button class="secondary" data-action="reset">Reiniciar</button></div>`;
}else{app.innerHTML+=`<section class="panel"><h2>Resposta: ${q.answer}</h2><p>${esc(q.options.find(o=>o.letter===q.answer).text)}</p><hr><p class="text">${esc(q.resolution)}</p></section><div class="nav"><button class="secondary" data-action="back">← Questão</button><button data-action="next">${saved.index===11?'Ver resultado':'Próxima questão →'}</button></div>`}app.innerHTML+='<footer>CURSO DE CONTABILIDADE PROFESSOR MOREIRA</footer>'}
function readName(){const e=document.getElementById('studentName');if(e)saved.name=e.value.trim();if(!saved.name){document.getElementById('nameError').textContent='Digite seu nome para iniciar.';return false}return true}function clearAnswers(){saved.answers={};saved.index=0;persist()}
app.addEventListener('change',e=>{if(e.target.name==='alternative')selection=e.target.value});app.addEventListener('submit',e=>{e.preventDefault();if(e.target.id!=='answerForm')return;const checked=app.querySelector('input[name="alternative"]:checked');if(!checked){document.getElementById('choiceError').textContent='Marque uma alternativa antes de confirmar.';return}const q=questions[saved.index];saved.answers[q.num]=checked.value;persist();render();playSound(checked.value===q.answer);document.querySelector('.signal').scrollIntoView({behavior:'smooth',block:'center'})});
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;switch(a){case 'access':{const n=document.getElementById('studentName');whatsapp(`Olá, Professor Moreira! ${n&&n.value.trim()?'Meu nome é '+n.value.trim()+'. ':''}Gostaria de solicitar acesso ao Quiz ${quiz} de CONTABILIDADE DE CUSTOS.`);break}case 'start':if(readName()){clearAnswers();navigate('question',0)}break;case 'resume':if(readName())navigate('question');break;case 'sound':saved.sound=!saved.sound;if(!saved.sound)stopAudio();persist();render();break;case 'solution':navigate('solution');break;case 'next':navigate(saved.index===11?'end':'question',saved.index===11?11:saved.index+1);break;case 'back':navigate('question');break;case 'previous':navigate('question',saved.index-1);break;case 'cover':navigate('cover');break;case 'reset':if(confirm('Apagar as respostas deste quiz e começar novamente?')){clearAnswers();navigate('cover')}break;case 'retry':delete saved.answers[questions[saved.index].num];navigate('question');break;case 'replay':playSound(saved.answers[questions[saved.index].num]===questions[saved.index].answer);break;case 'review':navigate('question',0);break;case 'send':whatsapp(`Professor Moreira, sou ${saved.name}. Concluí o Quiz ${quiz} de Contabilidade de Custos. Resultado: ${result()} de 12 acertos (${Math.round(result()/12*100)}%).`);break}});render();
</script></body></html>
